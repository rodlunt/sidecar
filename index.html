<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sidecar</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="app">
      <aside id="sidebar">
        <div id="app-brand">
          <img src="/src/assets/icon.svg" alt="" width="18" height="18" />
          <span>sidecar</span>
        </div>
        <div id="sidebar-header">
          <span id="root-label">No folder open</span>
          <button id="open-folder-btn" title="Open folder">Open</button>
        </div>
        <div id="sidebar-accordion">
          <section class="accordion-item" data-panel="files">
            <button class="accordion-header">Files</button>
            <div id="file-tree" class="accordion-content"></div>
          </section>
          <section class="accordion-item" data-panel="git">
            <button class="accordion-header">Git</button>
            <div id="git-graph-panel" class="accordion-content">
              <div id="git-graph-status"></div>
              <div id="git-graph-container"></div>
            </div>
          </section>
          <section class="accordion-item" data-panel="issues">
            <button class="accordion-header">Issues</button>
            <div id="issues-panel" class="accordion-content"></div>
          </section>
        </div>
      </aside>
      <div id="sidebar-resize-handle"></div>
      <main id="terminal"></main>
    </div>
  </body>
</html>
